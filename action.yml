---
name: Multiple Watchtowers Update
description: Trigger several Watchtower HTTP API update endpoints.
author: Mayurifag

inputs:
  watchtower-urls:
    description: Space-separated Watchtower update URLs.
    required: true
  watchtower-tokens:
    description: Space-separated Watchtower HTTP API tokens.
    required: true

runs:
  using: composite
  steps:
    - name: Trigger Watchtower updates
      shell: bash
      env:
        WATCHTOWER_URLS: ${{ inputs.watchtower-urls }}
        WATCHTOWER_TOKENS: ${{ inputs.watchtower-tokens }}
      run: |
        set -euo pipefail

        read -r -a urls <<< "${WATCHTOWER_URLS}"
        read -r -a tokens <<< "${WATCHTOWER_TOKENS}"

        if [[ "${#urls[@]}" -eq 0 || -z "${urls[0]:-}" ]]; then
          echo "WATCHTOWER_URLS must contain at least one URL" >&2
          exit 1
        fi

        if [[ "${#tokens[@]}" -eq 0 || -z "${tokens[0]:-}" ]]; then
          echo "WATCHTOWER_TOKENS must contain at least one token" >&2
          exit 1
        fi

        if [[ "${#tokens[@]}" -ne 1 && "${#tokens[@]}" -ne "${#urls[@]}" ]]; then
          echo "WATCHTOWER_TOKENS must contain either one token or one token per URL" >&2
          exit 1
        fi

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "${tmp_dir}"' EXIT

        pids=()
        for index in "${!urls[@]}"; do
          (
            number=$((index + 1))
            token="${tokens[0]}"

            if [[ "${#tokens[@]}" -gt 1 ]]; then
              token="${tokens[index]}"
            fi

            echo "Triggering Watchtower ${number}"
            if ! http_status=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST --header "Authorization: Bearer ${token}" "${urls[index]}" 2>/dev/null); then
              echo "Watchtower ${number} request failed" >&2
              exit 1
            fi

            if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
              echo "Watchtower ${number} failed with HTTP ${http_status}" >&2
              exit 1
            fi

            echo "Triggered Watchtower ${number}"
          ) >"${tmp_dir}/${index}.log" 2>&1 &
          pids+=("$!")
        done

        failed=0
        for index in "${!pids[@]}"; do
          if ! wait "${pids[index]}"; then
            failed=1
          fi
        done

        for index in "${!urls[@]}"; do
          cat "${tmp_dir}/${index}.log"
        done

        if [[ "${failed}" -ne 0 ]]; then
          exit 1
        fi

        echo "Triggered ${#urls[@]} Watchtower update(s)"

branding:
  icon: refresh-cw
  color: blue
